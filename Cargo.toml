[workspace]
resolver = "2"
members = [
    "crates/tinybrowser-dom",
    "crates/tinybrowser-net",
    "crates/tinybrowser-core",
    "crates/tinybrowser-cdp",
    "crates/tinybrowser-js",
    "crates/tinybrowser-cli",
    "crates/tinybrowser-lib",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/h4ckf0r0day/obscura"

# ─── Lints ────────────────────────────────────────────────────────────────────
# Strict (not strict-strict): `all` is error, `pedantic`/`cargo` are warnings.
# No `nursery` (experimental). No `allow` list — fix code instead of silencing.
# `restriction` lints are denied individually (blanket is banned by clippy).
[workspace.lints.rust]
unsafe_code = "deny"
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# restriction — explicit, no blanket
todo = "deny"
unimplemented = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
let_underscore_future = "deny"
unused_result_ok = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
mem_forget = "deny"
not_unsafe_ptr_arg_deref = "deny"
ptr_as_ptr = "deny"
ref_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"
cast_ptr_alignment = "deny"
lossy_float_literal = "deny"
implicit_saturating_sub = "deny"
dbg_macro = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
needless_collect = "deny"

[workspace.dependencies]
tinybrowser-dom = { path = "crates/tinybrowser-dom" }
tinybrowser-net = { path = "crates/tinybrowser-net" }
tinybrowser-core = { path = "crates/tinybrowser-core" }
tinybrowser-cdp = { path = "crates/tinybrowser-cdp" }
tinybrowser-js = { path = "crates/tinybrowser-js" }

html5ever = "0.39"
markup5ever = "0.39"
selectors = "0.26"
servo_arc = "0.4"
cssparser = "0.34"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
slotmap = "1.0"

# Unwinding (the Rust default) is REQUIRED for the anti-panic protocol: ops wrap
# their bodies in std::panic::catch_unwind so a panic degrades to an error return
# instead of unwinding into QuickJS's FFI frame and aborting the process. panic="abort"
# would turn every catchable op panic into a hard crash.
[profile.release]
panic = "unwind"
