[workspace]
resolver = "2"
members = [
    "crates/tinybrowser-dom",
    "crates/tinybrowser-net",
    "crates/tinybrowser-core",
    "crates/tinybrowser-cdp",
    "crates/tinybrowser-js",
    "crates/tinybrowser-cli",
    "crates/tinybrowser-lib",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/h4ckf0r0day/obscura"

# ─── Lints ────────────────────────────────────────────────────────────────────
# Strict by default, modeled on the oxc/bun workspace setups:
#   - rustc: every warning is an error (`warnings` at priority -1; individual
#     lints can override back down).
#   - clippy: whole categories (all, pedantic, nursery, cargo) are denied at
#     priority -1, then individual lints are allowed below where the category
#     is noise for this codebase. On top of the categories, a curated set of
#     `restriction` lints (panic prevention, silent-error prevention, async
#     deadlocks, unsafe hygiene, numeric footguns) is denied explicitly.
#   - Suppressions must be `#[expect(clippy::x, reason = "...")]`, never bare
#     `#[allow]` (see `allow_attributes` / `allow_attributes_without_reason`).
#   - Every workspace member opts in with `[lints] workspace = true` in its
#     own Cargo.toml. Lint levels apply to `cargo build` / `cargo test` /
#     `cargo clippy` alike, so violations fail locally, not just in CI.
# See clippy.toml for test-code exemptions.
[workspace.lints.rust]
unsafe_code = "deny"
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# Base groups: enable all standard + pedantic checks
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "deny", priority = -1 }

# ── Anti-Panic & Runtime Reliability ───────────────────────────────────────────
todo = "deny"
unimplemented = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"

# ── Silent Error & Future Prevention ──────────────────────────────────────────
let_underscore_future = "deny"
unused_result_ok = "deny"

# ── Async & Concurrency Safety ────────────────────────────────────────────────
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "deny"

# ── Unsafe & Memory Hygiene ───────────────────────────────────────────────────
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
mem_forget = "deny"
not_unsafe_ptr_arg_deref = "deny"
ptr_as_ptr = "deny"
ref_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"
cast_ptr_alignment = "deny"

# ── Numeric & Correctness ─────────────────────────────────────────────────────
lossy_float_literal = "deny"
implicit_saturating_sub = "deny"
dbg_macro = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
needless_collect = "deny"

# ── Pedantic & Parser Friendly Exemptions ─────────────────────────────────────
assertions_on_result_states = "allow"
map_err_ignore = "allow"
string_slice = "allow"
too_long_first_doc_paragraph = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
too_many_arguments = "allow"
fn_params_excessive_bools = "allow"
non_std_lazy_statics = "allow"
result_large_err = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
return_self_not_must_use = "allow"
manual_let_else = "allow"
default_trait_access = "allow"
unwrap_used = "allow"
unwrap_in_result = "allow"
expect_used = "allow"
panic = "allow"
unreachable = "allow"
float_cmp = "allow"
float_cmp_const = "allow"
match_same_arms = "allow"
single_match_else = "allow"
used_underscore_binding = "allow"
items_after_statements = "allow"
type_complexity = "allow"
needless_pass_by_value = "allow"
struct_field_names = "allow"
unused_async = "allow"
unused_self = "allow"
assigning_clones = "allow"
unnecessary_to_owned = "allow"
format_push_string = "allow"
format_collect = "allow"
manual_strip = "allow"
should_implement_trait = "allow"
manual_flatten = "allow"
question_mark = "allow"
ref_option = "allow"
empty_line_after_doc_comments = "allow"
unreadable_literal = "allow"
ignore_without_reason = "allow"
doc_link_with_quotes = "allow"
let_underscore_must_use = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[workspace.dependencies]
tinybrowser-dom = { path = "crates/tinybrowser-dom" }
tinybrowser-net = { path = "crates/tinybrowser-net" }
tinybrowser-core = { path = "crates/tinybrowser-core" }
tinybrowser-cdp = { path = "crates/tinybrowser-cdp" }
tinybrowser-js = { path = "crates/tinybrowser-js" }

html5ever = "0.39"
markup5ever = "0.39"
selectors = "0.26"
servo_arc = "0.4"
cssparser = "0.34"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
slotmap = "1.0"

# Unwinding (the Rust default) is REQUIRED for the anti-panic protocol: ops wrap
# their bodies in std::panic::catch_unwind so a panic degrades to an error return
# instead of unwinding into QuickJS's FFI frame and aborting the process. panic="abort"
# would turn every catchable op panic into a hard crash.
[profile.release]
panic = "unwind"
