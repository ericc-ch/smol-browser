[package]
name = "tinybrowser-lib"
version = "0.1.0"
edition = "2021"
description = "Rust API for the tinybrowser headless browser"
readme = "README.md"
repository = "https://github.com/h4ckf0r0day/obscura"
license = "Apache-2.0"

[features]
default = ["api"]
api = ["tinybrowser-core", "tinybrowser-net", "tokio"]

[dependencies]
tinybrowser-core = { path = "../tinybrowser-core", optional = true }
tinybrowser-net = { path = "../tinybrowser-net", optional = true }
anyhow = "1"
tokio = { version = "1", features = ["rt"], optional = true }
thiserror = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
